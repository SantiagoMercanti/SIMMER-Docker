services:
  db:
    image: mysql:8.0
    container_name: simmer_db
    restart: always
    networks:
      - simmer_network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-simmer_db_despliegue}
      MYSQL_USER: ${MYSQL_USER:-simmer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-simmer_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent" ]
      interval: 5s
      timeout: 5s
      retries: 30

# Este servicio es para pruebas locales, en el despliegue se usaria el broker del laboratorio, por lo cual no sería necesario levantarlo.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: simmer_mosquitto
    restart: always
    networks:
      - simmer_network
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        BASE_PATH: "/a03"
        NEXT_PUBLIC_BASE_PATH: "/a03"
    image: simmer-app:prod
    container_name: simmer_app
    restart: always
    networks:
      - simmer_network
    env_file:
      - .env.production
    environment:
      NODE_ENV: "production"
      # Broker interno de test levantado en este docker
      MQTT_BROKER_URL: "mqtt://mosquitto:1883"
      # Broker remoto (descomentar si se quiere usar asegurandose de que corresponda a el MQTT BROKER del laboratorio).
      # MQTT_BROKER_URL: "mqtt://172.16.248.85:1883"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  nginx:
    image: nginx:stable
    container_name: simmer_nginx
    restart: always
    networks:
      - simmer_network
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: simmer_phpmyadmin
    restart: always
    networks:
      - simmer_network
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://localhost:8080/
      PMA_USER: ${MYSQL_USER:-simmer}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-simmer_password}
    ports:
      - "127.0.0.1:8080:80"

networks:
  simmer_network:
    driver: bridge

volumes:
  db_data:
  mosquitto_data:
  mosquitto_logs:
